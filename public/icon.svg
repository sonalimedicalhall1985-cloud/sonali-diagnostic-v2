<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="100%" stop-color="#17375e" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer subtle pulse ring -->
  <circle cx="256" cy="256" r="200" stroke="#1e40af" stroke-width="4" stroke-opacity="0.3" fill="none" />
  <circle cx="256" cy="256" r="160" stroke="#0d9488" stroke-width="3" stroke-dasharray="12 8" stroke-opacity="0.4" fill="none" />
  
  <!-- Diagnostic Medical Cross with Teal & White -->
  <path d="M226 120 H286 V226 H392 V286 H286 V392 H226 V286 H120 V226 H226 Z" fill="url(#tealGrad)" rx="16" />
  
  <!-- Inner Golden DNA / Diagnostic Heartbeat Wave -->
  <path d="M150 256 H210 L230 200 L260 310 L280 230 L300 256 H362" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Stethoscope / Laboratory Flask Accent Symbol -->
  <circle cx="256" cy="180" r="16" fill="#fbbf24" />
</svg>
