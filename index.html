    <script>
      // Disable Vite HMR WebSocket handshake in preview iframe cleanly while keeping all other WebSockets untouched
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (typeof NativeWebSocket === 'function') {
          window.WebSocket = function (url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            var urlStr = String(url || '');
            if (
              protoStr.indexOf('vite-hmr') !== -1 ||
              protoStr.indexOf('vite-ping') !== -1 ||
              urlStr.indexOf('vite-hmr') !== -1
            ) {
              var listeners = {};
              var noopSocket = {
                url: urlStr,
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                protocol: protoStr,
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function () {},
                close: function () {},
                addEventListener: function (type, cb) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(cb);
                  if (type === 'open' && typeof cb === 'function') {
                    setTimeout(function () {
                      try { cb({ type: 'open', target: noopSocket }); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function (type, cb) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function (fn) { return fn !== cb; });
                },
                dispatchEvent: function () { return true; },
              };
              return noopSocket;
            }
            return protocols !== undefined ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();

      // Gracefully suppress benign Vite HMR WebSocket connection closed error in preview iframe
      window.addEventListener('error', function(event) {
        if (
          event &&
          (
            (event.message && (event.message.includes('WebSocket') || event.message.includes('ws://') || event.message.includes('wss://'))) ||
            (event.filename && event.filename.includes('@vite/client'))
          )
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event &&
          event.reason &&
          (
            String(event.reason).includes('WebSocket') ||
            String(event.reason).includes('@vite/client')
          )
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>

  </body>
